name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # scripts/check.mjs and scripts/build-tokens.mjs use Node built-ins only.
      - run: npm run check
      # server.mjs needs serve-handler; the smoke test proves agents get AGENTS.md and browsers get the site.
      - run: npm ci
      - run: npm run smoke
